name: Isolated trade-entry verification
on:
  push:
    branches: [codex/trade-entry-hotfix-20260924]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      DATABASE_URL: postgresql://test:test@127.0.0.1:1/isolated
      TENANT_DATABASE_URL: postgresql://test:test@127.0.0.1:1/isolated
      DATABASE_URL_UNPOOLED: postgresql://test:test@127.0.0.1:1/isolated
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Read installed Next.js guidance before app changes
        run: |
          for file in node_modules/next/dist/docs/01-app/01-getting-started/03-layouts-and-pages.md node_modules/next/dist/docs/01-app/01-getting-started/05-server-and-client-components.md node_modules/next/dist/docs/01-app/01-getting-started/11-css.md; do
            echo "--- $file ---"
            if test -f "$file"; then sed -n '1,170p' "$file"; else echo 'Required bundled guidance is missing'; exit 1; fi
          done
      - name: Run scoped verification when hotfix is present
        run: |
          if test -f scripts/verify-trade-entry-hotfix.mjs; then
            node scripts/verify-trade-entry-hotfix.mjs
          else
            echo 'Read-only preparation; no application changes yet.'
          fi
